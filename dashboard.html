<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSU Student Voice Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        psu: {
                            blue: '#0A2A66',
                            light: '#1B4596',
                            accent: '#F3F4F6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-gray-800">
    <canvas id="particles-js"></canvas>

    <!-- Top Nav -->
    <nav class="bg-psu-blue text-white shadow-md relative z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <a href="index.html" class="text-white hover:text-gray-300 transition"><i class="fas fa-arrow-left"></i> กลับ</a>
                    <h1 class="text-xl font-semibold">PSU Student Voice Dashboard</h1>
                </div>
                <div class="text-sm opacity-80">
                    อัพเดทล่าสุด: <span id="last-update">-</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-white bg-opacity-80 z-50 flex flex-col justify-center items-center">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-psu-blue"></div>
        <p class="mt-4 text-psu-blue font-medium text-lg">กำลังโหลดข้อมูล...</p>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">
        
        <!-- Stat Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Total -->
            <div class="glass-card rounded-xl shadow-lg p-6 border border-gray-100 transform hover:scale-105 transition duration-300">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 font-medium mb-1">เรื่องร้องเรียนทั้งหมด</p>
                        <h3 class="text-3xl font-bold text-psu-blue" id="total-count">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-psu-blue text-xl">
                        <i class="fas fa-folder-open"></i>
                    </div>
                </div>
            </div>
            
            <!-- Pending -->
            <div class="glass-card rounded-xl shadow-lg p-6 border border-gray-100 transform hover:scale-105 transition duration-300">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 font-medium mb-1">รอดำเนินการ</p>
                        <h3 class="text-3xl font-bold text-yellow-500" id="pending-count">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center text-yellow-500 text-xl">
                        <i class="fas fa-clock"></i>
                    </div>
                </div>
            </div>
            
            <!-- Done -->
            <div class="glass-card rounded-xl shadow-lg p-6 border border-gray-100 transform hover:scale-105 transition duration-300">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 font-medium mb-1">เสร็จสิ้นแล้ว</p>
                        <h3 class="text-3xl font-bold text-green-500" id="done-count">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center text-green-500 text-xl">
                        <i class="fas fa-check-circle"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <!-- Bar Chart -->
            <div class="glass-card rounded-xl shadow-lg p-6 border border-gray-100">
                <h3 class="text-lg font-semibold text-gray-700 mb-4"><i class="fas fa-chart-bar mr-2 text-psu-blue"></i>สถิติตามประเภทเรื่อง</h3>
                <div class="relative h-72">
                    <canvas id="typeChart"></canvas>
                </div>
            </div>
            
            <!-- Doughnut Chart -->
            <div class="glass-card rounded-xl shadow-lg p-6 border border-gray-100">
                <h3 class="text-lg font-semibold text-gray-700 mb-4"><i class="fas fa-chart-pie mr-2 text-psu-blue"></i>สัดส่วนตามสถานะ</h3>
                <div class="relative h-72 flex justify-center">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
        </div>
        
    </main>

    <script src="dashboard.js"></script>
</body>
</html>
